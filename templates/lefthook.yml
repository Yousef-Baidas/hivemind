# lefthook (https://lefthook.dev). Installed by the hivemind scaffold ticket.
# Replace the EDIT lines with the gate commands recorded in AGENTS.md ## Learned.
commit-msg:
  commands:
    conventional:
      run: node .claude/hooks/commit-msg.js {1}

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: echo EDIT-typecheck   # e.g. npx tsc --noEmit | uv run mypy . | cargo check
    lint:
      run: echo EDIT-lint        # e.g. npx eslint {staged_files} | ruff check | cargo clippy -- -D warnings

pre-push:
  commands:
    test:
      run: echo EDIT-test        # e.g. npx vitest run | uv run pytest -q | cargo test
